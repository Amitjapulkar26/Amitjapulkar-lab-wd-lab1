<!DOCTYPE html>
<html>
<head>
    <title>Simple Page</title>
    <style>
        body { 
            font-family: Arial; 
            margin: 0; 
            background: #f4f4f4;
        }

        header { 
            background: #11c1e0; 
            color: white; 
            text-align: center; 
            padding: 20px; 
        }

        nav { 
            background: #333; 
            padding: 10px; 
            text-align: center; 
        }

        nav a { 
            color: white; 
            margin: 0 15px; 
            text-decoration: none; 
        }

        nav a:hover { text-decoration: underline; }

        main { 
            display: flex; 
            padding: 15px; 
        }

        section, aside { 
            background: white; 
            padding: 15px; 
            margin: 5px; 
            border-radius: 5px;
        }

        section { flex: 3; }
        aside { flex: 1; }

        img { 
            border-radius: 5px; 
            margin-top: 10px; 
        }

        mark { 
            background: #11c1e0; 
            color: white; 
            padding: 2px 5px;
        }

        footer { 
            background: #333; 
            color: white; 
            text-align: center; 
            padding: 10px; 
            margin-top: 10px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Website</h1>
    <time datetime="2026-02-12">Feb 12, 2026</time>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
</nav>

<main>

<section>
    <article>
        <h2>Article</h2>
        <p>This is a <mark>simple page</mark>.</p>
         
        <figure>
            <img src="https://i.natgeofe.com/n/fb06a623-59be-4185-99a3-d63009a033d3/chimpanzee_thumb_square.JPG?wp=1&w=357&h=357" height="150" width="150">
            <figcaption>Sample Image</figcaption>
        </figure>

        <details>
            <summary>Read More</summary>
            <p>This is NATKHAT CHIMPANJI PILLU</p>
        </details>
    </article>
</section>

<aside>
    <h3>Sidebar</h3>
    <p>Sidebar content</p>
    <img src="https://i.natgeofe.com/n/fb06a623-59be-4185-99a3-d63009a033d3/chimpanzee_thumb_square.JPG?wp=1&w=357&h=357" height="120">
</aside>

</main>

<footer>
    <p>Amitjapulkar © Copyright Reserved</p>
</footer>

</body>
</html>
